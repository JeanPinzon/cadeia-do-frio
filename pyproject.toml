[project]
name = "frio"
version = "0.1.0"
description = "Monitoramento inteligente da cadeia do frio com IoT e IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "paho-mqtt>=2.2.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]

[project.scripts]
frio = "frio.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
