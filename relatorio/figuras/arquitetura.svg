<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="DejaVu Sans, Arial" font-size="12">
  <rect width="760" height="210" fill="#fff"/>
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect x="10" y="40" width="130" height="110" rx="8" fill="#E3F2FD" stroke="#1565C0"/>
  <text x="75" y="62" text-anchor="middle" font-weight="bold">Baú (sensores)</text>
  <text x="75" y="84" text-anchor="middle">temperatura</text><text x="75" y="100" text-anchor="middle">porta, umidade</text>
  <text x="75" y="116" text-anchor="middle">ciclo do compressor</text><text x="75" y="132" text-anchor="middle">GPS, temp. externa</text>
  <rect x="185" y="40" width="130" height="110" rx="8" fill="#FFF8E1" stroke="#F9A825"/>
  <text x="250" y="62" text-anchor="middle" font-weight="bold">Borda (gateway)</text>
  <text x="250" y="84" text-anchor="middle">descarta picos</text><text x="250" y="100" text-anchor="middle">estima buracos</text>
  <text x="250" y="116" text-anchor="middle">alarme local</text><text x="250" y="132" text-anchor="middle">(sem internet)</text>
  <rect x="360" y="60" width="90" height="70" rx="8" fill="#F3E5F5" stroke="#6A1B9A"/>
  <text x="405" y="90" text-anchor="middle" font-weight="bold">Broker</text><text x="405" y="108" text-anchor="middle">MQTT QoS 1</text>
  <rect x="495" y="30" width="130" height="130" rx="8" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="560" y="52" text-anchor="middle" font-weight="bold">Nuvem</text>
  <text x="560" y="74" text-anchor="middle">modelo de ciclo</text><text x="560" y="90" text-anchor="middle">CUSUM</text>
  <text x="560" y="106" text-anchor="middle">regra de porta (GPS)</text><text x="560" y="122" text-anchor="middle">previsão, vida útil</text>
  <text x="560" y="138" text-anchor="middle">ação sugerida</text>
  <rect x="665" y="40" width="85" height="50" rx="8" fill="#fff" stroke="#555"/><text x="707" y="70" text-anchor="middle">SQLite</text>
  <rect x="665" y="110" width="85" height="50" rx="8" fill="#fff" stroke="#555"/><text x="707" y="140" text-anchor="middle">Painel</text>
  <line x1="140" y1="95" x2="183" y2="95" stroke="#333" marker-end="url(#s)"/>
  <line x1="315" y1="95" x2="358" y2="95" stroke="#333" marker-end="url(#s)"/>
  <line x1="450" y1="95" x2="493" y2="95" stroke="#333" marker-end="url(#s)"/>
  <line x1="625" y1="65" x2="663" y2="65" stroke="#333" marker-end="url(#s)"/>
  <line x1="707" y1="90" x2="707" y2="108" stroke="#333" marker-end="url(#s)"/>
  <text x="335" y="185" text-anchor="middle" font-size="11" fill="#555">frio/&lt;caminhão&gt;/bruto  →  frio/&lt;caminhão&gt;/tratado  →  frio/&lt;caminhão&gt;/alerta</text>
